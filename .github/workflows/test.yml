name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell source
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\LeanADB.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Run isolated install/update/uninstall smoke test
        shell: powershell
        run: .\tests\Smoke-Test.ps1
      - name: Run path, signature, launcher, and cleanup regression test
        shell: powershell
        run: .\tests\Regression-Test.ps1
      - name: Verify language selection and translation coverage
        shell: powershell
        run: .\tests\Localization-Test.ps1
      - name: Verify release manifest response parsing
        shell: powershell
        run: .\tests\Manifest-Test.ps1
      - name: Verify sideload targeting and cleanup
        shell: powershell
        run: .\tests\Menu-Actions-Test.ps1
      - name: Verify settings, bounded commands, and transactional recovery
        shell: powershell
        run: .\tests\Hardening-Test.ps1
      - name: Verify task navigation and safe retry workflows
        shell: powershell
        run: .\tests\UX-Test.ps1
      - name: Verify drag-and-drop argument safety
        shell: powershell
        run: .\tests\Drag-Drop-Test.ps1
      - name: Verify local ZIP installation and archive safety
        shell: powershell
        run: .\tests\Offline-Test.ps1
      - name: Build and verify bootstrap release
        shell: powershell
        run: |
          .\build\Build-Release.ps1
          .\tests\Release-Test.ps1
          .\tests\Self-Update-Test.ps1

  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse source and locale
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\LeanADB.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count) { $errors | Format-List; exit 1 }
          Get-Content '.\locales\ko.json' -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null
      - name: Run PowerShell 7 smoke test
        shell: pwsh
        run: .\tests\Smoke-Test.ps1
      - name: Run PowerShell 7 regression test
        shell: pwsh
        run: .\tests\Regression-Test.ps1
      - name: Verify PowerShell 7 language behavior
        shell: pwsh
        run: .\tests\Localization-Test.ps1
      - name: Verify PowerShell 7 manifest response parsing
        shell: pwsh
        run: .\tests\Manifest-Test.ps1
      - name: Verify PowerShell 7 menu actions
        shell: pwsh
        run: .\tests\Menu-Actions-Test.ps1
      - name: Verify PowerShell 7 hardening regressions
        shell: pwsh
        run: .\tests\Hardening-Test.ps1
      - name: Verify PowerShell 7 task navigation and retries
        shell: pwsh
        run: .\tests\UX-Test.ps1
      - name: Verify PowerShell 7 drag-and-drop launcher
        shell: pwsh
        run: .\tests\Drag-Drop-Test.ps1
      - name: Verify PowerShell 7 offline installation
        shell: pwsh
        run: .\tests\Offline-Test.ps1

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-powershell, powershell-7]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and build verified bootstrap
        shell: powershell
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Release tag must match VERSION.' }
          .\build\Build-Release.ps1
          .\tests\Release-Test.ps1
          .\tests\Self-Update-Test.ps1
      - name: Publish matching ZIP, checksum, and update manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          $changelog = Get-Content .\CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, '(?ms)^## ' + [regex]::Escape($version) + '[^\r\n]*\r?\n(.*?)(?=^## |\z)')
          if (-not $section.Success) { throw 'Release changelog section is missing.' }
          $changes = $section.Groups[1].Value.Trim()
          $notes = @"
          LeanADB $version by leodroid99

          Download LeanADB-bootstrap-v$version.zip, extract the whole ZIP, and run Install.cmd.

          $changes

          Language: Korean Windows display language uses Korean; other languages use English, with a manual override.

          Validation: automated Windows PowerShell 5.1 and PowerShell 7 tests. No physical Android device testing was performed. USB/Fastboot, wireless, APK, and capture workflows are not hardware-verified. Cancelling a client is not a rollback of device changes.

          This bootstrap contains LeanADB scripts, not Google binaries. Official Platform-Tools are downloaded separately after Android SDK license acceptance. LeanADB scripts use the MIT License; Google tools retain their own license and notices. LeanADB is not affiliated with Google. The LeanADB script is not Authenticode-signed; Google ADB/Fastboot signatures are verified during installation.
          "@
          gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --title "LeanADB $version" --notes $notes ".\dist\LeanADB-bootstrap-v$version.zip" ".\dist\LeanADB-bootstrap-v$version.zip.sha256" '.\dist\LeanADB-release.json'
          if ($LASTEXITCODE) { throw 'Release publication failed.' }
